version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "5000:5000"
    environment:
      - PORT=5000
      - PHOTOGRAMMETRY_ENGINE=demo
      - COLMAP_PATH=/usr/bin/colmap
    volumes:
      - ./storage:/app/storage
      - ./public/demo:/app/public/demo
    restart: unless-stopped

  # Optional Python FastAPI Photogrammetry Backend
  python-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PHOTOGRAMMETRY_ENGINE=demo
      - COLMAP_PATH=/usr/bin/colmap
    volumes:
      - ./storage:/app/storage
    profiles:
      - full
